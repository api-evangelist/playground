problem_types:
  - status: 404
    title: Not Found
    when: Unknown path, or a record ID that does not exist in baseline or overlay.
    observed: true
    remediation: Check the path is under /api/v1 and the ID format (integer or local-<uuid>).
  - status: 401
    title: Unauthorized
    when: GET/PATCH /auth/me called without a valid Authorization Bearer token.
    observed: false
    remediation: 'Obtain a token from POST /auth/login or /auth/register and send Authorization: Bearer <token>.'
  - status: 429
    title: Too Many Requests
    when: 'Simulated on demand via ?_ratelimit=true or X-Simulate-RateLimit: true.'
    observed: false
    headers:
      - Retry-After
    remediation: Honor Retry-After; this is a testable simulation, not an enforced limit.
  - status: '4xx/5xx (simulated)'
    title: Simulated error boundary
    when: >-
      Any request carrying ?_status=<code> or X-Simulate-Status: <code> (400-599)
      returns that status so clients can exercise error branches.
    observed: false
    remediation: Remove the _status parameter / X-Simulate-Status header to get a normal response.
notes: >-
  This is a mock/sandbox API: its most important error behavior is that errors
  are DELIBERATELY INDUCIBLE (status and rate-limit simulation) rather than
