name: Playground API — Free Stateful Mock REST & GraphQL Service
description: >-
  A free, zero-configuration, stateful mock REST and GraphQL API sandbox by Nilesh Kumar / Niles Labs. Unlike static
  mock APIs, it provides stateful per-session virtual mutation overlays where POST/PUT/PATCH/DELETE mutations persist
  across GET queries within a session, while the global baseline dataset remains read-only. Includes chaos/network
  simulation, dynamic collections, avatar/thumbnail generators, and simulated JWT auth loops. MIT licensed, no auth or
  signup required.
